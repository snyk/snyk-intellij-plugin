version: 2.1

orbs:
  # Trialling the agentic fix from snyk/prodsec-orb#166. Dev orb versions are mutable and
  # expire after 90 days - switch back to snyk/prodsec-orb@1 once that PR is released.
  prodsec: snyk/prodsec-orb@dev:3bec319bb32dd5d70a45c1a28d05f41ee4a4525a

jobs:
  security-scans:
    resource_class: medium+
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout
      - prodsec/security_scans:
          mode: auto
          open-source-scan: high
          open-source-agentic-fix-enabled: true
          open-source-additional-arguments: --exclude=test
          release-branch: master
          iac-scan: disabled
          debug: true

workflows:
  version: 2
  CICD:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
          channel: snyk-on-snyk-devex_ide

      - security-scans:
          context:
            - devex_ide
            # LITELLM_API_KEY, LITELLM_BASE_URL, LITELLM_MODEL and REMY_GITHUB_TOKEN for the
            # agentic fix. Without this the feature skips with a message naming what is missing.
            - prodsec-orb-runtime
